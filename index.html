<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f2f0" />
    <!--
      Inline SVG favicon: the diverging rails of the makas with the red junction.
      A data URI means no extra request, and in particular no request for
      /favicon.ico, which this deploy has no such file for and which would
      otherwise be answered by the SPA rewrite with index.html (200, text/html)
      for an image path. Percent-encoded because a literal '#' would be parsed as
      a fragment and truncate the URI.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox%3D'0 0 32 32'%3E%3Crect width%3D'32' height%3D'32' rx%3D'6' fill%3D'%23171512'%2F%3E%3Cg stroke%3D'%23f3f2f0' stroke-width%3D'2.5' stroke-linecap%3D'round' fill%3D'none'%3E%3Cpath d%3D'M16 27V17'%2F%3E%3Cpath d%3D'M16 17 8 7'%2F%3E%3Cpath d%3D'M16 17 24 7'%2F%3E%3C%2Fg%3E%3Ccircle cx%3D'16' cy%3D'17' r%3D'3' fill%3D'%23a82a22'%2F%3E%3C%2Fsvg%3E"
    />
    <title>Absürt Tramvay İkilemleri</title>
    <meta name="description" content="Neal.fun'ın Absurd Trolley Problems oyununun Türk internet, yayıncı ve oyun topluluğuna özel interaktif felsefe oyunu." />
    <meta property="og:title" content="Absürt Tramvay İkilemleri" />
    <meta property="og:description" content="26 absürt ikilem. Tek bir makas kolu. Türk internetine özel interaktif felsefe oyunu." />
    <meta property="og:type" content="website" />
    <!--
      "summary" and not "summary_large_image": no Open Graph image is declared on
      this page, so the large-image card was promising crawlers a picture that does
      not exist and rendering an empty slot in the preview. Shipping an image was
      explicitly out of scope.
    -->
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
